name: Update Pokémon Card Prices

on:
  schedule:
    - cron: '0 3 * * *' # S'exécute tous les jours à 3h00 du matin
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Run script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Vérification URL (longueur) : ${#SUPABASE_URL}"
          node update-all-prices-paginated.js